services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scad
      POSTGRES_PASSWORD: scad
      POSTGRES_DB: scad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scad -d scad"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  gateway:
    container_name: scad-gateway
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://scad:scad@postgres:5432/scad
      BASE_DOMAIN: localhost:8080
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://host.docker.internal:4000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PREVIOUS_PUBLIC_KEY: ${JWT_PREVIOUS_PUBLIC_KEY:-}
      GATEWAY_FAKE_AUTH: ${GATEWAY_FAKE_AUTH:-0}
      # Magic-link email (T1.1). Mailpit inside Compose; UI at http://localhost:8025
      SMTP_URL: ${GATEWAY_SMTP_URL:-smtp://mailpit:1025}
      SMTP_FROM: ${SMTP_FROM:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # T2.1: the only way out for app containers (INV2). Attached to each app's
  # internal network by the runtime driver; reads per-app policy files the
  # driver writes to SCAD_EGRESS_POLICY_DIR (mounted read-only).
  egress-proxy:
    container_name: scad-egress
    build:
      context: apps/egress-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      EGRESS_POLICY_DIR: /policy
      # Operator approval (comma list; `*.example.com` patterns; `*` = any domain an app declares). Empty = deny all.
      EGRESS_ALLOWED_DOMAINS: ${EGRESS_ALLOWED_DOMAINS:-}
    volumes:
      - ${SCAD_EGRESS_POLICY_DIR:-~/.scad/egress-policy}:/policy:ro

volumes:
  postgres_data:
